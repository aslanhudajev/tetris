# Puzzie theme manifest
#
# Every theme installed in the game is declared here. One [theme] block per
# theme, one "key = value" per line, "#" starts a comment.
#
# "No Theme" is built into the binary and is always first in the list, so the
# game still runs with this whole folder deleted. Do not declare it here.
#
# See README.md in this folder for the art specification.
#
# Keys
#   id          required, stable key written to the settings file, never shown
#   name        required, shown in the theme picker
#   flavor      optional, one line shown under the name
#   author      optional, credit
#   tile        optional, grayscale block art, path relative to this folder
#   background  optional, window background, hex RGB
#   panel       optional, board backing and preview boxes, hex RGB
#   outline     optional, borders around the board and preview boxes, hex RGB
#   ghost       optional, landing preview style: "tile" (default) or "outline"
#   ghost_opacity  optional, 0 to 1. Defaults to 0.13 for tile, 0.5 for outline
#   color_i     optional, per piece colour overrides, hex RGB
#   color_o     .. these tint the grayscale tile, so they are the piece palette
#   color_t
#   color_s
#   color_z
#   color_j
#   color_l

[theme]
id = bevel
name = Beveled
flavor = Soft plastic blocks, lit from the top left.
author = Puzzie
tile = bevel/tile.png
background = 14141C
panel = 22222C
outline = 3C3C4A
ghost = tile

# Same art, but the landing preview is a hollow outline like the untextured
# default. Uncomment to try it.
[theme]
id = bevel-outline
name = Beveled (outline ghost)
flavor = Beveled blocks with a hollow landing preview.
tile = bevel/tile.png
ghost = outline

[theme]
id = puyopuyo
name = Puyopuyo
flavor = Puyopuyo blocks with a hollow landing preview.
tile = puyo/tile.png
ghost = tile