# Theme manifest. Every [theme] block adds one entry to the Themes menu.
#
# Every key is optional. Anything you leave out costs nothing at runtime: the
# game folds the whole manifest into plain values when a theme is activated,
# so an unused feature is not a branch in the draw loop, it is simply absent.
#
# BLOCKS  pick one of three, or none for flat colours
#   sheet = folder/blocks.png   authored cell per piece, drawn as painted
#   columns / rows / order      grid layout, defaults to 7 x 1 "I O T S Z J L"
#   tile = folder/tile.png      one grey image multiplied by the piece colour
#   color_i ... color_l         piece palette, also used by flat blocks
#   block_radius / block_inset / block_border_width / block_border
#
# BACKDROP  pick one
#   background = 14141C         base colour
#   background_bottom = 000000  turns it into a vertical gradient
#   background_flat              solid, no gradient
#   background_image = f/x.png  with background_fit = stretch | cover | tile
#   background_shader = f/x.fs  fragment shader, gets `time` and `resolution`
#
# PANEL and WELL  same six keys each, prefixed `panel_` or `well_`
#   panel / well                fill colour
#   panel_border / well_border  edge colour, needs a width to show
#   panel_border_width / well_border_width
#   panel_radius / well_radius  0 is square, which is the default
#   panel_image / well_image    with panel_fit / well_fit
#
# INTERFACE  text, separators and overlays. Only needed if the backdrop is pale
#   ui = light | dark           preset, must come before any override below
#   ui_ink / ui_ink_soft        headings and body text
#   ui_muted / ui_dim           secondary text and small caps labels
#   ui_hairline                 separators and the grid in the well
#   ui_chip / ui_chip_ink       the bar behind the HOLD and NEXT labels
#   ui_scrim                    laid over the backdrop behind the menu
#   ui_accent                   collapses every mode colour onto one
#
# Colours are hex RGB or RGBA, with or without a leading #.

# Solid colours only. No art, no texture binds, nothing sampled.
[theme]
id = neon
name = Neon
flavor = Flat blocks in a loud palette. No art at all.
color_i = 00F0FF
color_o = FFE600
color_t = C77DFF
color_s = 39FF6A
color_z = FF3B6B
color_j = 3B7BFF
color_l = FF9F1C
block_radius = 0.28
block_inset = 2
block_border_width = 2
background_shader = shaders/outrun.fs
# Kept as the fallback: if the shader will not compile on a given machine the
# game drops back to this gradient rather than to nothing.
background = 0B0B12
background_bottom = 15121F

# Animated backdrop. One quad, one shader, no texture reads. The well and the
# panels are translucent so the sky carries through behind the board.
#
# The id stays `aurora` from when this drew a colour field, so anyone who
# already had it selected keeps it.
[theme]
id = aurora
name = Starfield
flavor = Parallax stars drifting past a soft nebula.
background_shader = shaders/starfield.fs
well = 0A0912C0
panel = 0A0912C0
ghost = outline

