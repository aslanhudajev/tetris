# Deliberately the only theme with no shader and no gradient. The original is a
# black field with white boxes ruled around it, and anything moving back there
# would be a different game wearing its palette.
#
# Every colour below is a real entry from the NES palette. The original recolours
# the pieces every level and a theme here is fixed, so this is level 0: white,
# light blue, blue. Which piece gets which colour is a judgement call, spread so
# that the pairs easiest to confuse -- S against Z, J against L -- never share
# one.
[theme]
