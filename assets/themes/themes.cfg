# Theme manifest. Every [theme] block adds one entry to the Themes menu.
#
# Every key is optional. Anything you leave out costs nothing at runtime: the
# game folds the whole manifest into plain values when a theme is activated,
# so an unused feature is not a branch in the draw loop, it is simply absent.
#
# BLOCKS  pick one of three, or none for flat colours
#   sheet = folder/blocks.png   authored cell per piece, drawn as painted
#   columns / rows / order      grid layout, defaults to 7 x 1 "I O T S Z J L"
#   tile = folder/tile.png      one grey image multiplied by the piece colour
#   color_i ... color_l         piece palette, also used by flat blocks
#   block_radius / block_inset / block_border_width / block_border
#
# BACKDROP  pick one
#   background = 14141C         base colour
#   background_bottom = 000000  turns it into a vertical gradient
#   background_flat              solid, no gradient
#   background_image = f/x.png  with background_fit = stretch | cover | tile
#   background_shader = f/x.fs  fragment shader, gets `time` and `resolution`
#
# PANEL and WELL  same six keys each, prefixed `panel_` or `well_`
#   panel / well                fill colour
#   panel_border / well_border  edge colour, 0 width turns the edge off
#   panel_border_width / well_border_width
#   panel_radius / well_radius
#   panel_image / well_image    with panel_fit / well_fit
#
# Colours are hex RGB or RGBA, with or without a leading #.

[theme]
id = bevel
name = Beveled
flavor = Glossy candy blocks, lit from the top left.
author = Puzzie
sheet = bevel/blocks.png
background = 14141C
panel = 22222C
panel_border = 3C3C4A
ghost = outline

# Solid colours only. No art, no texture binds, nothing sampled.
[theme]
id = neon
name = Neon
flavor = Flat blocks in a loud palette. No art at all.
color_i = 00F0FF
color_o = FFE600
color_t = C77DFF
color_s = 39FF6A
color_z = FF3B6B
color_j = 3B7BFF
color_l = FF9F1C
block_radius = 0.28
block_inset = 2
block_border_width = 2
background = 0B0B12
background_bottom = 15121F
panel = 15151F
panel_border = 2E2E42
well = 090910
well_border = 1F1F30

# Animated backdrop. One quad, one shader, no texture reads.
[theme]
id = aurora
name = Aurora
flavor = Drifting colour field behind glossy blocks.
sheet = bevel/blocks.png
background_shader = shaders/aurora.fs
panel = 1A182880
panel_border = 3A3652
well = 0A0912C0
well_border = 342F4A
ghost = outline

# The fallback art path: one grayscale image multiplied by the piece colour.
# Quick to make and recolourable from here, but a multiply tint only changes
# brightness, so every facet of a block ends up the same hue.
[theme]
id = puyopuyo
name = Puyopuyo
flavor = Chunky bevelled blocks with a glossy top facet.
sheet = puyo/blocks.png
background = 121820
panel = 1E2833
panel_border = 38485C
ghost = outline

# Ripped sheets are rarely in the order this game expects, and often carry
# extra cells. Describe the layout instead of re-cutting the image:
#
# [theme]
# id = ripped
# name = Ripped Sheet
# sheet = ripped/blocks.png
# columns = 8
# rows = 2
# order = S Z J L T O I - - - - - - - - -
#
# `order` is one line covering the whole grid, row by row. Above, the first
# seven cells of row one are the pieces, the eighth and all of row two are
# skipped. Cells you skip cost nothing but the space in the image.
